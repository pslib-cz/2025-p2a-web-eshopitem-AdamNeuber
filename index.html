<!doctype html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/main.css">
    <title>eshop item</title>
</head>
<body>
    <main>
        <figure class="card">
            <header class="card__header">
                <a href="#">
                    <img class="card__img" src="./images/1.webp" alt="klicenka">
                </a>
                <a class="heading" href="#">MINI klíčenka 3x3 kostka 3.5cm (QiYi)</a>
            </header>
            <p class="green">skladem, ihned k odeslání</p>
            <div class="card__container">
                <p class="card__container--price"><strong>149 Kč</strong></p>
                <a href="#" class="btn">Detail</a>
            </div>
            <p class="subtext">QiYi Mini Keychain 3x3x3 kostka, s kterou můžeš skládat. Malá rubikovka (3,5 cm) vždy po ruce na klíčích.</p>
        </figure>
        <figure class="card">
            <div class="badge"><span class="badge__text">Bestseller</span></div>
            <header class="card__header">
                <a href="#">
                    <img class="card__img" src="./images/2.webp" alt="megaminx">
                </a>
                <a class="heading" href="#">YuHu Megaminx V2 M (YJ)</a>
            </header>
            <p class="green">skladem, ihned k odeslání</p>
            <div class="card__container">
                <p class="card__container--price"><strong>369 Kč</strong></p>
                <a href="#" class="btn">Detail</a>
            </div>
            <p class="subtext">YuHu V2 M je cenově dostupné magnetický megaminx pro cubery všech úrovní</p>
        </figure>
        <figure class="card">
            <header class="card__header">
                <a href="#">
                    <img class="card__img" src="./images/3.webp" alt="megaminx">
                </a>
                <a class="heading" href="#">Huameng YS3M Ball Core + Maglev (MoYu)</a>
            </header>
            <p class="green">skladem, ihned k odeslání</p>
            <div class="card__container">
                <p class="card__container--price"><strong>599 Kč</strong></p>
                <a href="#" class="btn">Detail</a>
            </div>
            <p class="subtext">HuaMeng YS3M ve verzi s kulatým středem Ball Core a Maglev je nejnovější vlajková loď 3x3 kostky roku 2023 od slavné cube společnosti MoYu.</p>
        </figure>
    </main>
</body>
</html>
